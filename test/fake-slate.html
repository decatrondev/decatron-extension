<!doctype html><html><head><meta charset="utf-8"><title>slatetest - Twitch</title>
<style>body{margin:0;background:#0e0e10;color:#efeff1;font-family:Inter,system-ui,sans-serif} #root{position:fixed;left:40px;bottom:30px;width:340px;background:#1f1f23;border-radius:6px;padding:6px 10px}
[data-a-target="chat-input"]{min-height:40px;outline:none;padding:10px 0;white-space:pre-wrap}

<script type="importmap">{"imports":{"react":"https://esm.sh/react@18.3.1","react-dom/client":"https://esm.sh/react-dom@18.3.1/client","slate":"https://esm.sh/slate@0.103.0?deps=react@18.3.1","slate-react":"https://esm.sh/slate-react@0.110.3?deps=react@18.3.1,react-dom@18.3.1,slate@0.103.0"}}</script>
</head><body>
<div class="chat-scrollable-area__message-container"></div>
<div id="root"></div>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import { createEditor } from 'slate';
import { Slate, Editable, withReact } from 'slate-react';
const editor = withReact(createEditor());
const initial = [{ type: 'paragraph', children: [{ text: '' }] }];
window.__text = () => editor.children.map((n) => n.children.map((c) => c.text).join('')).join('\n');
createRoot(document.getElementById('root')).render(
  React.createElement(Slate, { editor, initialValue: initial },
    React.createElement(Editable, { 'data-a-target': 'chat-input', className: 'chat-wysiwyg-input__editor', placeholder: 'Enviar un mensaje' })));
document.title = 'slatetest - Twitch (listo)';
</script></body></html>
